name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Linux / Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build packaged CLI
        run: ./gradlew :reveal-kt:app:shadowJar --console=plain
      - name: Install Chromium and system libraries
        run: java -cp "reveal-kt/app/build/libs/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Check JVM, JavaScript and packaged CLI scenarios
        run: ./gradlew build --console=plain
      # Pinned to a commit: a moving branch could change what runs with repository access.
      - uses: jbangdev/setup-jbang@cc28889678db839e29433f42f9ff25f148b6d8de # main, 2026-09-26
      - name: Verify Maven publication with JBang
        run: bash scripts/check-jbang.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: error
      - name: Build documentation and render example presentations
        if: matrix.java == '21'
        run: ./gradlew buildSite --console=plain
      - name: Upload documentation site
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: build/site
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload verified CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-java-${{ matrix.java }}
          path: reveal-kt/app/build/libs/revealkt.jar
          if-no-files-found: error

  publish-site:
    name: Publish documentation site
    # The site documents master, so every verified master push republishes it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: site
      - name: Check site scripts
        run: |
          node --check site/assets/site.js
          node --check site/assets/examples.js
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Push the site to gh-pages
        working-directory: pages
        run: |
          # Replace only the generated website; keep unrelated branch files (as scripts/publish-site.sh does).
          rm -rf assets examples
          cp -R ../site/. .
          git add --all -- index.html .nojekyll assets examples
          if git diff --cached --quiet; then
            echo "gh-pages already contains this site."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Publish RevealKt documentation website from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-java-21
          path: release
      - name: Attach standalone CLI to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/revealkt.jar --clobber
          else
            gh release create "$RELEASE_TAG" release/revealkt.jar --verify-tag --generate-notes
          fi

  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SECRET_PASSPHRASE: ${{ secrets.SECRET_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_SIGNING_KEY" | base64 -d > publish_key.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="$SECRET_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/release.gpg" publish_key.gpg

      - name: Publish to GitHub Packages
        run: |
          ./gradlew publishAllPublicationsToMainRepoRepository \
            -Psigning.secretKeyRingFile="$GITHUB_WORKSPACE/release.gpg" \
            -Psigning.password="$GPG_PASSWORD" \
            -Psigning.keyId="$GPG_KEY_ID"
        env:
          REPO_USERNAME: ${{ github.actor }}
          REPO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Import GPG Key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SECRET_PASSPHRASE: ${{ secrets.SECRET_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_SIGNING_KEY" | base64 -d > publish_key.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="$SECRET_PASSPHRASE" \
            --output "$GITHUB_WORKSPACE/release.gpg" publish_key.gpg

      - name: Publish to Maven Central
        run: |
          ./gradlew publishAndReleaseToMavenCentral \
            -Psigning.secretKeyRingFile="$GITHUB_WORKSPACE/release.gpg" \
            -Psigning.password="$GPG_PASSWORD" \
            -Psigning.keyId="$GPG_KEY_ID" \
            -PmavenCentralUsername="$OSSRH_USERNAME" \
            -PmavenCentralPassword="$OSSRH_PASSWORD"
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
