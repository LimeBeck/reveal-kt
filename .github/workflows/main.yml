name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Linux / Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build packaged CLI
        run: ./gradlew :reveal-kt:app:shadowJar --console=plain
      - name: Install Chromium and system libraries
        run: java -cp "reveal-kt/app/build/libs/*" com.microsoft.playwright.CLI install --with-deps chromium
      - name: Check JVM, JavaScript and packaged CLI scenarios
        run: ./gradlew build --console=plain
      - uses: jbangdev/setup-jbang@main
      - name: Verify Maven publication with JBang
        run: bash scripts/check-jbang.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
          if-no-files-found: error
      - name: Upload verified CLI
        uses: actions/upload-artifact@v4
        with:
          name: cli-java-${{ matrix.java }}
          path: reveal-kt/app/build/libs/*-all.jar
          if-no-files-found: error

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-java-21
          path: release
      - name: Attach standalone CLI to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*-all.jar --clobber
          else
            gh release create "$RELEASE_TAG" release/*-all.jar --verify-tag --generate-notes
          fi

  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Import GPG Key
        run: |
          echo '${{secrets.GPG_SIGNING_KEY}}' | base64 -d > publish_key.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="${{secrets.SECRET_PASSPHRASE}}" \
            --output $GITHUB_WORKSPACE/release.gpg publish_key.gpg

      - name: Publish to GitHub Packages
        run: |
          ./gradlew publishAllPublicationsToMainRepoRepository \
            -Psigning.secretKeyRingFile=$GITHUB_WORKSPACE/release.gpg \
            -Psigning.password=${{ secrets.GPG_PASSWORD }} \
            -Psigning.keyId=${{ secrets.GPG_KEY_ID }}
        env:
          REPO_USERNAME: ${{ github.actor }}
          REPO_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ./.gradle/
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Import GPG Key
        run: |
          echo '${{secrets.GPG_SIGNING_KEY}}' | base64 -d > publish_key.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="${{secrets.SECRET_PASSPHRASE}}" \
            --output $GITHUB_WORKSPACE/release.gpg publish_key.gpg

      - name: Publish to Maven Central
        run: |
          ./gradlew publishAndReleaseToMavenCentral \
            -Psigning.secretKeyRingFile=$GITHUB_WORKSPACE/release.gpg \
            -Psigning.password=${{ secrets.GPG_PASSWORD }} \
            -Psigning.keyId=${{ secrets.GPG_KEY_ID }} \
            -PmavenCentralUsername=${{ secrets.OSSRH_USERNAME }} \
            -PmavenCentralPassword=${{ secrets.OSSRH_PASSWORD }}
        env:
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
