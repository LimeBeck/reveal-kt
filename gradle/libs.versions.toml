[versions]
kotlin = "2.4.20"
serialization = "1.11.0"
ktor = "3.5.2"
kxhtml = "0.12.0"
dokka = "2.2.0"
arrow = "2.2.3"

[libraries]
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.19" }
logback = { module = "ch.qos.logback:logback-classic", version = "1.6.3" }
clikt = { module = "com.github.ajalt.clikt:clikt", version = "5.1.0" }
kxhtml-jvm = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.ref = "kxhtml" }
kxhtml = { module = "org.jetbrains.kotlinx:kotlinx-html", version.ref = "kxhtml" }
kotlin-css = { module = "org.jetbrains.kotlin-wrappers:kotlin-css", version = "2026.9.1" }
kotlin-extensions = { module = "org.jetbrains.kotlin-wrappers:kotlin-extensions", version = "1.0.1-pre.823" }
uuid = { module = "com.benasher44:uuid", version = "0.8.4" }
qrcode = { module = "io.github.g0dkar:qrcode-kotlin", version = "4.5.0" }
playwright = { module = "com.microsoft.playwright:playwright", version = "1.62.0" }

kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin", version.ref = "kotlin" }

kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-dependencies = { module = "org.jetbrains.kotlin:kotlin-scripting-dependencies", version.ref = "kotlin" }
kotlin-scripting-dependencies-maven-all = { module = "org.jetbrains.kotlin:kotlin-scripting-dependencies-maven-all", version.ref = "kotlin" }

arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-ksp = { module = "io.arrow-kt:arrow-optics-ksp-plugin", version.ref = "arrow" }
arrow-optics = { module = "io.arrow-kt:arrow-optics", version.ref = "arrow" }

ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-html-builder-jvm = { module = "io.ktor:ktor-server-html-builder-jvm", version.ref = "ktor" }

[plugins]
versions = { id = "io.github.ben-manes.versions", version = "0.61.0" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
build-config = { id = "dev.limebeck.build-time-config", version = "2.3.1" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.11" }
publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
publish-base = { id = "com.vanniktech.maven.publish.base", version = "0.37.0" }
